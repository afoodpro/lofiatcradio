<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#e3e5e2">
  <title>ATC Live Radio</title>
  <meta name="description" content="Lo-fi music with live air traffic control.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ATC Live Radio">
  <meta property="og:description" content="Lo-fi music with live air traffic control.">
  <meta property="og:image" content="https://afoodpro.github.io/lofiatcradio/v3/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://afoodpro.github.io/lofiatcradio/v3/og-image.png">
  <meta name="twitter:title" content="ATC Live Radio">
  <meta name="twitter:description" content="Lo-fi music with live air traffic control.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/teko-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/device.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="device" aria-label="ATC Live Radio">
    <div class="reel-cell">
      <header class="brand">
        <h1 class="title">ATC LIVE RADIO <span>WITH LO-FI</span></h1>
        <span class="lamp" id="lamp" data-state="off" aria-hidden="true"></span>
      </header>
      <div class="window">
        <canvas id="reel" role="img" aria-label="Radar around the selected airport"></canvas>
      </div>
    </div>

    <div class="deck">
      <button class="board" id="board" type="button" aria-label="Next station">
        <span class="board-row row-code" id="f-code"></span>
        <span class="board-row row-city" id="f-city"></span>
        <span class="board-row row-info">
          <span class="board-group" id="f-time"></span>
          <span class="board-group" id="f-freq"></span>
          <span class="board-group" id="f-pos"></span>
        </span>
      </button>

      <div class="controls">
        <div class="transport">
          <div class="keys" role="group" aria-label="Transport">
            <button class="key" id="key-prev" type="button" aria-label="Previous station">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3v16H5zM19 4 9 12l10 8z"/></svg>
            </button>
            <button class="key" id="key-play" type="button" aria-label="Play" aria-pressed="false" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>
            </button>
            <button class="key" id="key-next" type="button" aria-label="Next station">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8zM16 4h3v16h-3z"/></svg>
            </button>
          </div>
          <div class="key-labels" aria-hidden="true"><span>PREV</span><span>PLAY</span><span>NEXT</span></div>
        </div>

        <div class="dials">
          <div class="dial dial-sleep"><span class="dial-label" aria-hidden="true">SLEEP</span><div class="dial-knob" id="knob-sleep"></div></div>
          <div class="dial"><span class="dial-label" aria-hidden="true">LO-FI</span><div class="dial-knob" id="knob-lofi"></div></div>
          <div class="dial"><span class="dial-label" aria-hidden="true">ATC</span><div class="dial-knob" id="knob-atc"></div></div>
          <p class="hint" id="hint" role="status"></p>
        </div>
      </div>
    </div>

    <a class="tg" href="https://t.me/a_food" target="_blank" rel="noopener" aria-label="Telegram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 3.6 2.9 10.8c-1 .4-1 1.8.1 2.1l4.5 1.4 1.7 5.4c.3.9 1.4 1.1 2 .4l2.5-2.4 4.6 3.4c.8.6 1.9.1 2.1-.8l3-14.6c.2-1.2-.9-2.1-2-1.7zM9.9 14.6l-.4 3.6-1.3-4.3 9.6-6.3z"/></svg>
    </a>

    <p class="sr-only" id="announce" aria-live="polite"></p>
  </main>
</body>
</html>
